name: Release

# Builds the Keycloak provider jar and publishes it as a GitHub Release asset.
# Triggered by pushing a version tag (e.g. v1.0.0), or run manually.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Created at the current commit if it does not exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: mvn -B -f magiclogin/pom.xml clean package -DskipTests

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Publish release with jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=magiclogin/target/email.loginwith.secure.keycloak.magiclogin.jar
          test -f "$JAR" || { echo "::error::expected artifact missing: $JAR"; exit 1; }
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.tag.outputs.tag }}" "$JAR" --clobber
          else
            gh release create "${{ steps.tag.outputs.tag }}" "$JAR" \
              --title "${{ steps.tag.outputs.tag }}" \
              --generate-notes
          fi
